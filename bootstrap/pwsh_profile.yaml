- hosts: localhost
  connection: local
  become: yes

  vars:
    user: "{{ ansible_facts.env.SUDO_USER | default(ansible_user_id) }}"
    home: "/home/{{ user }}"
    ssh_dir: "{{ home }}/.ssh"
    repo_url: "git@github.com:kkthxbye/powershell-profile.git"
    repo_dest: "{{ home }}/.pwsh-profile"

  tasks:
    - name: Ensure ~/.ssh exists.
      file:
        path: "{{ ssh_dir }}"
        state: directory
        mode: '0700'
        owner: "{{ user }}"
        group: "{{ user }}"

    - name: Ensure known_hosts exists.
      file:
        path: "{{ ssh_dir }}/known_hosts"
        state: touch
        mode: '0644'
        owner: "{{ user }}"
        group: "{{ user }}"

    - name: Add GitHub host key.
      known_hosts:
        name: "github.com"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 github.com') }}"
        path: "{{ ssh_dir }}/known_hosts"

    - name: Clone PowerShell profile repo.
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: master
        accept_hostkey: yes
        key_file: "{{ ssh_dir }}/id_ed25519"
        update: yes
      become_user: "{{ user }}"
      become: yes
      register: pwsh_profile_clone
      ignore_errors: yes

    - name: Warn if PowerShell profile repo has local modifications.
      debug:
        msg: "{{ repo_dest }} has local modifications; skipping profile install. Commit or stash your changes, then re-run this playbook."
      when: pwsh_profile_clone is failed

    - name: Check if installed PowerShell profile is a symlink.
      stat:
        path: "{{ home }}/.config/powershell/Microsoft.PowerShell_profile.ps1"
      register: pwsh_profile_target

    - name: Check if installed PowerShell Include directory is a symlink.
      stat:
        path: "{{ home }}/.config/powershell/Include"
      register: pwsh_include_target

    - name: Warn if the local PowerShell profile has unsaved edits.
      debug:
        msg: "{{ home }}/.config/powershell/Microsoft.PowerShell_profile.ps1 exists and isn't a symlink; it may hold local edits. Commit them into {{ repo_dest }} and re-run this playbook, or remove the file to let it be linked."
      when: pwsh_profile_target.stat.exists and not pwsh_profile_target.stat.islnk

    - name: Warn if the local PowerShell Include directory has unsaved edits.
      debug:
        msg: "{{ home }}/.config/powershell/Include exists and isn't a symlink; it may hold local edits. Commit them into {{ repo_dest }}/Include and re-run this playbook, or remove the directory to let it be linked."
      when: pwsh_include_target.stat.exists and not pwsh_include_target.stat.islnk

    - name: Install PowerShell profile via repo installer.
      command: pwsh -File "{{ repo_dest }}/Install-Profile.ps1"
      become_user: "{{ user }}"
      become: yes
      when:
        - pwsh_profile_clone is succeeded
        - not (pwsh_profile_target.stat.exists and not pwsh_profile_target.stat.islnk)
        - not (pwsh_include_target.stat.exists and not pwsh_include_target.stat.islnk)

    - name: Install fzf.
      package:
        name: fzf
        state: present

    - name: Install PSFzf PowerShell module.
      command: pwsh -Command "Install-Module -Name PSFzf -Force -Scope CurrentUser"
      become_user: "{{ user }}"
      become: yes

    - name: Install powershell-yaml module.
      command: pwsh -Command "Install-Module -Name powershell-yaml -Force -Scope CurrentUser"
      become_user: "{{ user }}"
      become: yes
