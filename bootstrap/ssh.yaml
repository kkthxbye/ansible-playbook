- hosts: localhost
  connection: local
  become: yes
  tags: ssh

  vars:
    user: "{{ ansible_facts.env.SUDO_USER | default(ansible_facts.user_id) }}"
    home: "/home/{{ user }}"
    ssh_dir: "{{ home }}/.ssh"
    private_key: "{{ ssh_dir }}/id_ed25519"
    public_key: "{{ ssh_dir }}/id_ed25519.pub"

  tasks:
    - name: Ensure ~/.ssh exists
      file:
        path: "{{ ssh_dir }}"
        state: directory
        mode: '0700'
        owner: "{{ user }}"
        group: "{{ user }}"

    - name: Generate ed25519 SSH keypair for the invoking user
      openssh_keypair:
        path: "{{ private_key }}"
        type: ed25519
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0600'
      register: keypair

    - name: Output public key
      debug:
        msg: "{{ keypair.public_key }}"

    - name: Ensure openssh-server is installed
      apt:
        name: openssh-server
        state: present

    - name: Disable dynamic MOTD via PAM
      replace:
        path: /etc/pam.d/sshd
        regexp: '^(session\s+optional\s+pam_motd\.so.*(?:noupdate|motd=/run/motd\.dynamic).*)$'
        replace: '#\1'

    - name: Truncate static MOTD
      copy:
        dest: /etc/motd
        content: ""
        owner: root
        group: root
        mode: '0644'

    - name: Disable MOTD and last-login banner in sshd_config
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?\s*PrintMotd', line: 'PrintMotd no' }
        - { regexp: '^#?\s*PrintLastLog', line: 'PrintLastLog no' }
      notify: Restart sshd

    - name: Configure sshd to listen on port 8022
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*Port\s'
        line: 'Port 8022'
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      command: service ssh restart
      changed_when: true
