- hosts: localhost
  connection: local
  become: yes

  vars:
    user: "{{ ansible_facts.env.SUDO_USER | default(ansible_user_id) }}"

  tasks:
    - name: Allow passwordless sudo for the user
      copy:
        dest: "/etc/sudoers.d/{{ user }}"
        content: "{{ user }} ALL=(ALL) NOPASSWD:ALL"
        owner: root
        group: root
        mode: '0440'
