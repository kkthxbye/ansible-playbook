---
- hosts: localhost
  connection: local
  become: true

  vars:
    postgresql_keyring_path: "/usr/share/keyrings/postgresql-keyring.gpg"

  tasks:
    - name: Install mysql-client.
      package:
        name: mysql-client
        state: present

    - name: Ensure prerequisites are installed.
      package:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Download PostgreSQL apt signing key.
      get_url:
        url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
        dest: "/tmp/postgresql.asc"
        mode: '0644'

    - name: Dearmor PostgreSQL apt signing key.
      shell: "gpg --dearmor -o {{ postgresql_keyring_path }} /tmp/postgresql.asc"
      args:
        creates: "{{ postgresql_keyring_path }}"

    - name: Add PostgreSQL apt repository.
      apt_repository:
        repo: "deb [signed-by={{ postgresql_keyring_path }}] https://apt.postgresql.org/pub/repos/apt {{ ansible_facts.distribution_release }}-pgdg main"
        state: present
        filename: pgdg

    - name: Update apt package index.
      apt:
        update_cache: yes

    - name: Install latest PostgreSQL client.
      package:
        name: postgresql-client
        state: present
