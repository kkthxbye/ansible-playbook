---
- hosts: localhost
  connection: local
  become: true

  vars:
    user: "{{ ansible_facts.env.SUDO_USER | default(ansible_facts.user_id) }}"
    keyring_path: "/usr/share/keyrings/docker-archive-keyring.gpg"

  tasks:
    - name: Ensure prerequisites are installed.
      package:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Download Docker apt signing key.
      get_url:
        url: "https://download.docker.com/linux/ubuntu/gpg"
        dest: "/tmp/docker.key"
        mode: '0644'

    - name: Dearmor Docker apt signing key.
      shell: "gpg --dearmor -o {{ keyring_path }} /tmp/docker.key"
      args:
        creates: "{{ keyring_path }}"

    - name: Remove pre-existing Docker apt sources without signed-by.
      shell: >-
        grep -rl 'download.docker.com' /etc/apt/sources.list.d/ 2>/dev/null
        | xargs -r grep -L 'signed-by=' | xargs -r rm -f
      changed_when: false

    - name: Add Docker apt repository.
      apt_repository:
        repo: "deb [arch=amd64 signed-by={{ keyring_path }}] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable"
        state: present
        filename: docker

    - name: Update apt package index.
      apt:
        update_cache: yes

    - name: Install Docker CE.
      package:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Ensure docker group exists.
      group:
        name: docker
        state: present

    - name: Add current user to docker group.
      user:
        name: "{{ user }}"
        groups: docker
        append: yes

    - name: Ensure docker service is started and enabled.
      service:
        name: docker
        state: started
        enabled: true
