---
- hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Get latest doctl release info.
      uri:
        url: "https://api.github.com/repos/digitalocean/doctl/releases/latest"
        return_content: yes
      register: doctl_release

    - name: Map ansible_architecture to doctl release architecture.
      set_fact:
        doctl_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    - name: Set doctl archive fact.
      set_fact:
        doctl_archive: "doctl-{{ doctl_release.json.tag_name | regex_replace('^v', '') }}-linux-{{ doctl_arch }}.tar.gz"

    - name: Download doctl archive.
      get_url:
        url: "https://github.com/digitalocean/doctl/releases/download/{{ doctl_release.json.tag_name }}/{{ doctl_archive }}"
        dest: "/tmp/{{ doctl_archive }}"
        mode: '0644'

    - name: Extract doctl binary.
      unarchive:
        src: "/tmp/{{ doctl_archive }}"
        dest: "/usr/local/bin"
        remote_src: yes

    - name: Ensure doctl is executable.
      file:
        path: "/usr/local/bin/doctl"
        mode: '0755'
        state: file

    - name: Remove downloaded archive.
      file:
        path: "/tmp/{{ doctl_archive }}"
        state: absent
