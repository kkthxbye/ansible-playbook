---
- hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Install far2l.
      block:
        - name: Install far2l from the default repositories.
          apt:
            name: far2l
            state: present
            update_cache: yes
      rescue:
        - name: Ensure prerequisites are installed.
          package:
            name: software-properties-common
            state: present

        - name: Add far2l PPA.
          apt_repository:
            repo: "ppa:far2l-team/ppa"
            state: present

        - name: Install far2l from the PPA.
          apt:
            name: far2l
            state: present
            update_cache: yes

    - name: Create 'far' alias for far2l.
      file:
        src: /usr/bin/far2l
        dest: /usr/local/bin/far
        state: link
