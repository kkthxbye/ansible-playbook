---
- hosts: localhost
  connection: local
  become: true

  vars:
    user: "{{ ansible_facts.env.SUDO_USER | default(ansible_facts.user_id) }}"
    home: "/home/{{ user }}"
    repo_url: "https://github.com/kkthxbye/psqlps.git"
    repo_dest: "{{ home }}/code/PsqlPs"

  tasks:
    - name: Clone PsqlPs repo.
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: master
        update: yes
      become_user: "{{ user }}"
      become: yes
      register: psqlps_clone
      ignore_errors: yes

    - name: Warn if PsqlPs repo has local modifications.
      debug:
        msg: "{{ repo_dest }} has local modifications; skipping build. Commit or stash your changes, then re-run this playbook."
      when: psqlps_clone is failed

    - name: Install Microsoft.PowerShell.Crescendo module.
      command: pwsh -Command "Install-Module -Name Microsoft.PowerShell.Crescendo -Force -Scope CurrentUser"
      become_user: "{{ user }}"
      become: yes
      when: psqlps_clone is succeeded

    - name: Install InvokeBuild module.
      command: pwsh -Command "Install-Module -Name InvokeBuild -Force -Scope CurrentUser"
      become_user: "{{ user }}"
      become: yes
      when: psqlps_clone is succeeded

    - name: Build and install PsqlPs module.
      command: pwsh -Command "Invoke-Build"
      args:
        chdir: "{{ repo_dest }}"
      become_user: "{{ user }}"
      become: yes
      when: psqlps_clone is succeeded
