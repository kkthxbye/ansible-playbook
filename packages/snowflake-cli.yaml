---
- hosts: localhost
  connection: local
  become: true

  vars:
    user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    home: "/home/{{ user }}"

  tasks:
    - name: Ensure pipx is installed.
      package:
        name: pipx
        state: present

    - name: Install Snowflake CLI via pipx.
      community.general.pipx:
        executable: pipx
        name: snowflake-cli
        state: latest
      become_user: "{{ user }}"
      become: yes

    - name: Verify Snowflake CLI installation.
      command: "{{ home }}/.local/bin/snow --version"
      register: snow_ver
      become_user: "{{ user }}"
      become: yes
      changed_when: false

    - name: Display Snowflake CLI version.
      debug:
        var: snow_ver.stdout
