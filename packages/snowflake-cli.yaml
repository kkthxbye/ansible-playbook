---
- hosts: localhost
  connection: local
  become: true

  vars:
    user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    home: "/home/{{ user }}"

  tasks:
    - name: Install Snowflake CLI via uv.
      command: "{{ home }}/.local/bin/uv tool install snowflake-cli"
      become_user: "{{ user }}"
      become: yes

    - name: Verify Snowflake CLI installation.
      command: "{{ home }}/.local/bin/snow --version"
      register: snow_ver
      become_user: "{{ user }}"
      become: yes
      changed_when: false

    - name: Display Snowflake CLI version.
      debug:
        var: snow_ver.stdout
