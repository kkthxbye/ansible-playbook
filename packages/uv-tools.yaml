---
- hosts: localhost
  connection: local
  become: true

  vars:
    user: "{{ ansible_facts.env.SUDO_USER | default(ansible_facts.user_id) }}"
    home: "/home/{{ user }}"
    uv_tools:
      - pyiceberg
      - rust-just
      - keepercommander
      - snowflake-cli
      - sqlfluff
      - "python-dotenv[cli]"

  tasks:
    - name: Install build prerequisites.
      apt:
        name:
          - python3-dev
          - build-essential
          - gcc
        state: present
        update_cache: yes

    - name: Install uv-managed CLI tools.
      command: "{{ home }}/.local/bin/uv tool install {{ item }}"
      become_user: "{{ user }}"
      become: yes
      loop: "{{ uv_tools }}"

    - name: List installed uv-managed CLI tools.
      command: "{{ home }}/.local/bin/uv tool list"
      register: uv_tools_list
      become_user: "{{ user }}"
      become: yes
      changed_when: false

    - name: Display installed uv-managed CLI tools.
      debug:
        var: uv_tools_list.stdout_lines
