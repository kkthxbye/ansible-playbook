- hosts: localhost
  connection: local
  become: yes

  vars:
    user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    home: "/home/{{ user }}"
    ssh_dir: "{{ home }}/.ssh"
    private_key: "{{ ssh_dir }}/id_ed25519"
    public_key: "{{ ssh_dir }}/id_ed25519.pub"

  tasks:
    - name: Ensure ~/.ssh exists
      file:
        path: "{{ ssh_dir }}"
        state: directory
        mode: '0700'
        owner: "{{ user }}"
        group: "{{ user }}"

    - name: Generate ed25519 SSH keypair for the invoking user
      openssh_keypair:
        path: "{{ private_key }}"
        type: ed25519
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0600'
      register: keypair

    - name: Output public key
      debug:
        msg: "{{ keypair.public_key }}"
